[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orf-codon-toolkit"
version = "0.1.0"
description = "ORF finding, codon usage (RSCU) and GC skew for prokaryotic sequences"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
orfkit = "orfkit.cli:main"

[tool.setuptools]
packages = ["orfkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
